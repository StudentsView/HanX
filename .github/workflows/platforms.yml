name: Native Windows and Linux packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'desktop/**'
      - 'packaging/**'
      - '.github/workflows/platforms.yml'
permissions:
  contents: read
jobs:
  native-packages:
    timeout-minutes: 60
    env:
      HANX_SMOKE_OUTPUT_DIR: ${{ github.workspace }}/build/gui-smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build and Electron dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev libxml2-dev libsqlite3-dev libssl-dev libasound2 libnss3 libgtk-3-0 libgbm1 libfuse2 rpm xvfb libreoffice poppler-utils fonts-noto-cjk
      - name: Windows PDF renderer and text extraction
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install libreoffice-fresh poppler -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'PDF dependencies could not be installed' }
          'C:\Program Files\LibreOffice\program' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Get-ChildItem 'C:\ProgramData\chocolatey\lib\poppler' -Filter pdfinfo.exe -Recurse | ForEach-Object {
            $_.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with:
          swift-version: '6.2.1'
      - name: Install official Windows Swift toolchain
        uses: compnerd/gha-setup-swift@57fe462cd3c7b05ae8fcff79b00719312e305257
        if: runner.os == 'Windows'
        with:
          swift-version: swift-6.2.1-release
          swift-build: 6.2.1-RELEASE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native engine
        run: swift build -c release
      - name: Linux runtime staging
        if: runner.os == 'Linux'
        run: |
          python3 packaging/linux/stage-cli.py
          python3 packaging/linux/test-installer.py
          cp packaging/linux/install-cli.sh packaging/linux/install-gui.sh build/platform/cli/
          python3 packaging/smoke-cli.py build/platform/cli/hanx --pdf
          install_prefix=$(mktemp -d)
          build/platform/cli/install-cli.sh --components cli --yes --prefix "$install_prefix"
          PATH=/usr/bin:/bin "$install_prefix/bin/hanx" --version
          PATH=/usr/bin:/bin "$install_prefix/bin/hanx-cli" capabilities
          mkdir -p build/distribution
          version=$(node -p "require('./packaging/npm/package.json').version")
          tar -C build/platform/cli -czf "build/distribution/HanX-CLI-$version-linux-x64.tar.gz" .
      - name: Windows runtime staging and PATH tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/stage-cli.ps1
          ./packaging/windows/test-path.ps1
          python packaging/windows/test-console.py build/platform/cli/hanx.exe
          python packaging/smoke-cli.py build/platform/cli/hanx.exe --pdf
          New-Item -ItemType Directory -Path build/distribution -Force
          $version = (Get-Content packaging/npm/package.json | ConvertFrom-Json).version
          Compress-Archive -Path build/platform/cli/* -DestinationPath "build/distribution/HanX-CLI-$version-win32-x64.zip"
      - name: CLI and MCP regression suite
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export HANX_BIN="$(cygpath -w "$PWD")\build\platform\cli\hanx.exe"
          else
            export HANX_BIN="$PWD/build/platform/cli/hanx"
          fi
          python -m unittest discover -s Tests/AgentCLI -p test_cli.py
          python -m unittest discover -s Tests/AgentCLI -p test_spreadsheets.py
          python -m unittest discover -s Tests/AgentCLI -p test_mcp.py
      - name: Stage npm platform binary
        shell: bash
        run: |
          platform=$(node -p 'process.platform + "-" + process.arch')
          mkdir -p "packaging/npm/native/$platform"
          cp -R build/platform/cli/. "packaging/npm/native/$platform/"
          npm test --prefix packaging/npm
          npm pack ./packaging/npm --ignore-scripts --pack-destination build/distribution
          node packaging/npm/bin/hanx.js --version
      - name: Configure native desktop engine
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "HANX_CLI_PATH=$GITHUB_WORKSPACE/build/platform/cli/hanx.exe" >> "$GITHUB_ENV"
          else
            echo "HANX_CLI_PATH=$GITHUB_WORKSPACE/build/platform/cli/hanx" >> "$GITHUB_ENV"
          fi
      - name: Test desktop native integration
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Linux renderer smoke
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a node_modules/.bin/electron . --no-sandbox --smoke-test
      - name: Windows renderer smoke
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          & .\node_modules\.bin\electron.cmd . --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build desktop installers
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never
      - name: Windows installer choices, PATH and uninstall integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/dist/*Setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows Setup executable was not built' }
          ./packaging/windows/test-installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanx-${{ runner.os }}-gui-proof
          path: build/gui-smoke/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanx-${{ runner.os }}-x64
          path: |
            build/distribution/*
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
