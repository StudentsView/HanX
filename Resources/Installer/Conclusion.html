<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;color:#203247;margin:32px;line-height:1.7}h1{font-size:26px;font-weight:600}p{font-size:13px}</style><h1>HanX 설치가 끝났습니다</h1><p>응용 프로그램 폴더에서 HanX를 여세요.</p><p>설치 전부터 HanX가 열려 있었다면 종료한 뒤 다시 열어 새 버전을 사용하세요.</p><p>CLI는 터미널에서 <code>hanx --help</code>로 확인합니다. 다른 경로에 같은 명령이 있으면 기존 명령을 유지합니다.</p><p>본 제품은 한컴의 HWP 문서 파일(.hwp) 공개 문서를 참고하여 개발하였습니다.</p></html>
