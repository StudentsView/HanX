<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;color:#203247;margin:32px;line-height:1.7}h1{font-size:30px;font-weight:600;margin:0 0 22px}p{font-size:13px;margin:12px 0}strong{font-weight:600}</style><h1>HanX</h1><p>문서를 작성하고 표를 계산하고 프레젠테이션을 편집합니다.</p><p>이 설치 프로그램은 응용 프로그램 폴더에 HanX와 CLI를 설치합니다. 기존 HanX가 있으면 새 버전으로 갱신합니다.</p><p>작성한 문서와 다른 오피스 프로그램은 변경하지 않습니다.</p><p><strong>설치 전 열려 있는 HanX에서 작업을 저장하세요.</strong></p><p>CLI는 터미널에서 <code>hanx --help</code>로 확인합니다. 다른 경로에 같은 명령이 있으면 기존 명령을 유지합니다.</p></html>
