<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>HanX</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand" aria-label="HanX">HanX</div><div class="file-heading"><strong id="filename">새 문서</strong><span id="filetype">문서</span></div><div class="file-actions"><select id="newKind" aria-label="새 파일 형식" title="새 파일 형식"><option value="document">문서</option><option value="spreadsheet">스프레드시트</option><option value="presentation">프레젠테이션</option></select><button id="new">새로 만들기</button><button id="open">열기</button><button id="save" class="primary">저장</button><button id="saveAs">다른 이름으로 저장</button><span class="quick-divider"></span><button id="undo" title="실행 취소 (Ctrl/Cmd+Z)" aria-label="실행 취소">↶</button><button id="redo" title="다시 실행 (Ctrl/Cmd+Shift+Z)" aria-label="다시 실행">↷</button><button id="connections" title="AI와 MCP 연결">AI 연결</button><button id="help" title="도움말" aria-label="도움말">?</button></div></header>
<nav id="toolbar" aria-label="편집 도구"><div id="ribbonTabs" role="tablist" aria-label="리본 탭"></div><div id="tools" role="tabpanel" aria-label="리본 도구"></div></nav>
<main><aside class="navigation"><div class="aside-heading" id="outlineTitle">슬라이드</div><div id="outline"></div></aside><div id="editorArea"><section id="workspace" aria-label="편집 영역"></section><div id="sheetTabs" aria-label="워크시트" hidden></div></div><aside id="inspector" hidden><div class="aside-heading">크기와 위치</div><div id="properties"></div></aside></main>
<footer><span id="status" role="status">HanX를 여는 중…</span><span id="counts"></span></footer>
<dialog id="connectionDialog" aria-labelledby="connectionTitle"><form method="dialog"><button class="dialog-close" aria-label="닫기">×</button><h2 id="connectionTitle">AI 연결</h2><p>AI 앱의 MCP 설정에 아래 명령을 추가하세요. 연결 방식은 <code>stdio</code>입니다.</p><label>실행 파일<input id="enginePath" readonly></label><label>MCP 실행 명령<input id="mcpCommand" readonly></label><button class="primary">확인</button></form></dialog>
<div id="contextMenu" class="context-menu" role="menu" hidden></div>
<script src="model.js"></script><script src="renderer.js"></script></body></html>
