<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>HanX</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand" aria-label="HanX">Han<span>X</span></div><div class="file-heading"><strong id="filename">새 문서</strong><span id="filetype">문서</span></div><button id="connections" class="quiet" title="AI와 MCP 연결 안내">AI 연결</button><button id="open">열기</button><button id="save" class="primary">저장</button><button id="saveAs">다른 이름으로 저장</button></header>
<nav id="toolbar" aria-label="편집 도구"><label class="new-label"><select id="newKind" aria-label="새 파일 형식" title="새 파일 형식"><option value="document">문서</option><option value="spreadsheet">스프레드시트</option><option value="presentation">프레젠테이션</option></select></label><button id="new">새로 만들기</button><i></i><button id="undo" title="실행 취소 (Ctrl/Cmd+Z)">↶</button><button id="redo" title="다시 실행 (Ctrl/Cmd+Shift+Z)">↷</button><i></i><div id="tools"></div></nav>
<div id="notices" hidden></div><div id="error" role="alert" hidden></div>
<main><aside class="navigation"><div class="aside-heading" id="outlineTitle">구역</div><div id="outline"></div><div class="local-note"><span class="local-dot"></span> 이 기기에서 작업 중<br>저장을 누르면 파일에 반영됩니다.</div></aside><section id="workspace" aria-label="편집 영역"></section><aside id="inspector"><div class="aside-heading">속성</div><div id="properties"></div></aside></main>
<footer><span id="status" role="status">HanX를 여는 중…</span><span id="counts"></span></footer>
<dialog id="connectionDialog" aria-labelledby="connectionTitle"><form method="dialog"><button class="dialog-close" aria-label="닫기">×</button><div class="connection-icon">X</div><h2 id="connectionTitle">사용하던 AI와 연결하세요</h2><p>HanX의 문서 편집과 변환 기능을 로컬 CLI 또는 MCP로 사용할 수 있습니다. 이 창은 연결 안내만 표시합니다.</p><label>실행 파일<input id="enginePath" readonly></label><label>MCP 실행 명령<input id="mcpCommand" readonly></label><p>AI 앱의 MCP 설정에서 위 실행 파일을 선택하고 인수에 <code>mcp</code>를 입력하세요. 연결 방식은 <code>stdio</code>입니다. 문서를 AI 앱에 보내는 범위는 해당 앱에서 관리하세요.</p><p class="connection-note">HanX 편집기는 외부 AI 서비스를 호출하지 않습니다.</p><button class="primary">확인</button></form></dialog>
<div id="contextMenu" class="context-menu" role="menu" hidden></div>
<script src="model.js"></script><script src="renderer.js"></script></body></html>
